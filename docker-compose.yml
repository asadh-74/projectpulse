# Optional: run MySQL locally instead of SQLite.
#   docker compose up -d
# then in the Laravel .env set:
#   DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=projectpulse DB_USERNAME=pulse DB_PASSWORD=secret
services:
  mysql:
    image: mysql:8.4
    ports: ["3306:3306"]
    environment:
      MYSQL_DATABASE: projectpulse
      MYSQL_USER: pulse
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes: [dbdata:/var/lib/mysql]
volumes:
  dbdata:
